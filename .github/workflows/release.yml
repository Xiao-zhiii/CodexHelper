name: Release

# 触发：push v* tag 时自动发版
# 手动：Actions 页 → Release → Run workflow（可指定 tag）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，如 v1.7.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # 必须 Windows：打包产物是 Windows EXE，
    # 且 test_codex_modules_headless.py 里有 Windows 路径断言（C:\Users\...\.codex）
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 配置 Node（preflight 用 node --check 校验注入的 JS）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview

      - name: 发布前自检（门禁）
        # 三个沙箱自测 + 页面 JS 语法 + 版本一致性 + ICO 校验
        # 任一项失败即中断，不会打出有问题的包
        run: python preflight_check.py

      - name: 打包 EXE
        run: python -m PyInstaller --noconfirm --clean CodexHelper.spec

      - name: 冒烟测试
        # 起服务（不弹窗）跑一遍核心接口，确认产物真的能跑
        shell: pwsh
        run: |
          $exe = "dist\Codex小帮手.exe"
          if (-not (Test-Path $exe)) { throw "产物不存在：$exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "自检失败，退出码 $($p.ExitCode)" }
          Write-Host "冒烟测试通过"

      - name: 准备发布资产
        # 资产名保持历史约定 CodexHelper.exe（README 下载链接依赖它）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "dist\Codex小帮手.exe" "artifacts\CodexHelper.exe"
          Get-Item "artifacts\CodexHelper.exe" | Select-Object Name, Length

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/CodexHelper.exe
          generate_release_notes: true
          body: |
            ## Codex 小帮手 ${{ inputs.tag || github.ref_name }}

            下载 `CodexHelper.exe`，双击运行即可（无需安装 Node 或 Python）。

            > 若系统缺少 WebView2 运行时，程序会自动降级为 tkinter 界面；
            > 装上 WebView2 后自动恢复完整界面。

            ---

            本 Release 由 CI 自动生成，已通过发布前自检与冒烟测试。
